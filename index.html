<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 提示詞工具箱</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FFF8EB;--card:#fff;--tx:#18242d;--mu:#667580;--bd:#e4dccb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191f;--card:#1f252d;--tx:#eef1f4;--mu:#9aa6b0;--bd:#323b45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191f;--card:#1f252d;--tx:#eef1f4;--mu:#9aa6b0;--bd:#323b45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:clamp(.82rem,.7rem + .45vw,1rem)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:12px clamp(10px,2vw,24px) 12px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.15rem,1rem + 1vw,1.8rem);margin:0;line-height:1.2}
.sub{color:var(--mu);margin:0;font-size:.9em}
.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;min-height:0}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:none}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 12px;font:inherit;font-size:.9em;cursor:pointer}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.banner{flex:none;background:var(--c);color:#fff;border-radius:10px;padding:10px 14px;margin:4px 0 10px;font-weight:700}
.banner small{display:block;font-weight:400;opacity:.9}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:8px;padding:8px 12px}
.ind{flex:none;font-weight:700;width:5.2em}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.txt .f{display:block;font-size:.85em;color:var(--mu)}
.cp{flex:none;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:6px;padding:3px 12px;font:inherit;font-size:.85em;cursor:pointer}
.cp.ok{background:var(--c);color:#fff}
.item.more{display:none}.list.open .item.more{display:flex}.morebtn{flex:none;border:1px dashed var(--c);background:transparent;color:var(--c);border-radius:8px;padding:6px 10px;font:inherit;font-size:.88em;cursor:pointer}
.note{color:var(--mu);font-size:.82em;margin:2px 0 0}
.portal{display:flex;flex-direction:column;gap:8px;min-height:0;background:var(--card);border:1px solid var(--bd);border-top:6px solid #F5B63F;border-radius:10px;padding:10px 12px}
.ph{display:flex;justify-content:space-between;align-items:center;flex:none}
.ph b{font-size:1.05em}.ph small{color:var(--mu);display:block;font-size:.8em;line-height:1.3}
.x,.fab{display:none}
.plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ai{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:8px;padding:6px 8px}
.go{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;height:52px;text-decoration:none}
.go:hover{box-shadow:0 0 0 2px var(--c)}
.go img{display:block;flex:none;height:calc(var(--lh,28)*1px*var(--s,1));width:auto;max-width:none}
.qr{flex:none;width:clamp(64px,9vh,88px);aspect-ratio:1;background:#fff;border-radius:6px;display:block;padding:2px}
.qr svg{width:100%;height:100%;display:block}
@media (max-width:899px){
 .body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 .plist{flex-direction:row;overflow:visible}
 .ai{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:4px}
 .qr{align-self:center;width:clamp(56px,11vw,84px)}
}
@media (max-width:599px),(max-width:899px) and (max-height:520px){
 .body{grid-template-rows:1fr}
 .portal{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:80%;z-index:20;transform:translateY(130%);transition:transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
 .portal.open{transform:none}
 .plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));overflow-y:auto}
 .qr{width:84px}
 .ai{flex-direction:column}
 .x{display:block;border:0;background:none;color:var(--tx);font-size:1.3em;cursor:pointer}
 .fab{display:block;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;border:0;border-radius:999px;background:#F5B63F;color:#18242d;font:inherit;font-weight:700;padding:10px 18px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
 .list{padding-bottom:56px}
 .item{flex-wrap:wrap;gap:2px 10px;padding:8px 12px}.ind{width:auto;flex:1;order:1}.cp{order:2}.txt{order:3;flex:1 1 100%}
 .sub{display:none}
}
@media (max-width:899px){.go{height:44px;justify-content:center;padding:4px}.go img{height:calc(clamp(16px,2.6vw,22px)*var(--s,1))}}
@media (max-width:599px),(max-width:899px) and (max-height:520px){.go{--lh:24;height:52px}.go img{height:calc(var(--lh)*1px*var(--s,1))}}
@media (max-width:380px){.go{--lh:20}}
</style>
</head>

function copy(text,btn){
  const done=()=>{btn.textContent="已複製 ✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="複製";btn.classList.remove("ok")},1600)};
  const fb=()=>{try{const a=document.createElement("textarea");a.value=text;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done()}catch(e){btn.textContent="請手動複製"}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
